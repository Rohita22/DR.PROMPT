[project]
name = "dr-prompt-backend"
version = "0.1.0"
description = "FastAPI backend for DR. PROMPT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi[standard]>=0.116,<1.0",
    "groq>=1.6,<2.0",
    "jsonschema>=4.25,<5.0",
    "httpx>=0.28,<1.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "tiktoken>=0.12,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires an explicit disposable PostgreSQL TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
